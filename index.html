<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>✧ 𝙬𝙞𝙨𝙩𝙚𝙧𝙞𝙖 𝙄𝙉𝙁𝙊 ✧</title>
<style>
  /* ====== ЦВЕТА — меняй здесь ====== */
  :root{
    --bg:#171a2b;
    --panel:#212539;
    --panel-2:#2d3249;
    --line:#6f7898;
    --text:#f4f6ff;
    --muted:#b9c0d9;
    --accent:#e6e9f7;
    --accent-2:#8b93c4;
    --moon:#bfe6ff;
    --blush:#f2c9dc;
    /* переливающийся фон страницы */
    --g1:#090b14;   /* почти чёрный тёмно-синий */
    --g2:#1c1f2c;   /* тёмное серебро */
    --g3:#0d1a38;   /* тёмно-синий */
    --g4:#2b2f3d;   /* тёмное серебро, светлее */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:linear-gradient(120deg,var(--g1),var(--g2),var(--g3),var(--g4),var(--g1));background-size:300% 300%;animation:bgshift 28s ease-in-out infinite;min-height:100vh;color:var(--text);font-family:"Segoe UI",Roboto,Arial,sans-serif;line-height:1.55;padding:24px 16px 60px}
  .wrap{max-width:1000px;margin:0 auto;position:relative;z-index:1}
  @keyframes bgshift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  /* слой с полумесяцами (за контентом) */
  #sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

  /* ====== Плавное появление снизу вверх ====== */
  .reveal{opacity:0;transform:translateY(40px);transition:opacity .8s ease,transform .8s ease}
  .reveal.show{opacity:1;transform:none}

  /* ====== Шапка ====== */
  .header{
    position:relative;overflow:hidden;min-height:340px;display:flex;align-items:flex-start;
    padding:32px;border-radius:24px;border:1px solid var(--line);
    background:linear-gradient(100deg,#6f78b8 0%,#aab2e0 30%,var(--panel) 75%);
  }
  /* слева: аватарка, ник, «О себе» */
  .profile{display:flex;flex-direction:column;align-items:center;gap:12px;width:170px}
  .avatar-wrap{padding:4px;border-radius:50%;line-height:0;
    background:conic-gradient(from var(--angle),var(--accent-2),var(--moon),var(--blush),var(--accent),var(--accent-2));
    animation:spin 6s linear infinite;box-shadow:0 0 18px rgba(159,220,255,.35)}
  .avatar{display:block;width:130px;height:130px;border-radius:50%;object-fit:cover;border:0;background:var(--panel-2)}
  .nick{font-size:1.2rem;font-weight:700}
  .about-box{text-decoration:none;display:block;width:100%;text-align:center;padding:9px 14px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
    font:inherit;cursor:pointer;transition:border-color .25s,color .25s,background .25s,transform .2s}
  .about-box:hover{border-color:var(--accent);color:var(--text);background:var(--accent-2)}
  .about-box:active{transform:scale(.97)}

  /* фон шапки: фото или видео (запасной градиент виден, если файла нет) */
  .bg-media{position:absolute;inset:0;z-index:0;display:flex;flex-direction:column;gap:3px;background:var(--bg)}
  .bg-media img,.bg-media video{width:100%;flex:1;min-height:0;object-fit:cover;display:block}
  .bg-media::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(21,18,46,.65),rgba(21,18,46,.15) 60%,rgba(21,18,46,.35))}
  .profile{position:relative;z-index:1}

  /* справа: кнопка музыки (раскрывается влево) */
  .music{
    position:absolute;top:32px;right:32px;z-index:5;
    --mw:240px;width:var(--mw);height:56px;border-radius:28px;overflow:hidden;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);
    transition:width .5s cubic-bezier(.7,0,.2,1),height .5s cubic-bezier(.7,0,.2,1),border-radius .5s;
  }
  .music.open{width:min(320px,calc(100vw - 64px));height:210px;border-radius:20px;cursor:default}
  /* бегущая строка в закрытой плашке */
  .marq{position:absolute;left:20px;top:0;width:calc(var(--mw) - 76px);height:54px;display:flex;align-items:center;overflow:hidden;
    font-size:.9rem;font-weight:600;transition:opacity .25s;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
  .marq span{display:inline-block;white-space:nowrap}
  .marq span.scroll{animation:marq linear infinite}
  .marq span.scroll:hover{animation-play-state:paused}
  @keyframes marq{to{transform:translateX(-50%)}}
  .music.open .marq{opacity:0;pointer-events:none}
  .music-btn{position:absolute;top:0;right:0;width:54px;height:54px;border:0;background:none;color:var(--accent);font-size:1.5rem;cursor:pointer;z-index:2}
  .music-body{padding:16px 16px 14px;opacity:0;transition:opacity .3s;pointer-events:none}
  .music.open .music-body{opacity:1;pointer-events:auto;transition-delay:.3s}
  .track{display:flex;gap:12px;align-items:center;margin-right:44px;margin-bottom:14px;min-height:56px}
  .cover{width:56px;height:56px;border-radius:10px;flex-shrink:0;object-fit:cover;background:linear-gradient(135deg,var(--accent-2),var(--accent))}
  .t-title{font-weight:700;font-size:.95rem}
  .t-artist{color:var(--muted);font-size:.85rem}
  .bar{height:6px;border-radius:3px;background:var(--panel-2);cursor:pointer;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--blush),var(--moon))}
  .time{display:flex;justify-content:space-between;color:var(--muted);font-size:.75rem;margin:6px 0 8px}
  .ctrl{display:flex;justify-content:center;gap:14px}
  .ctrl button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-size:1rem;cursor:pointer;transition:background .2s}
  .ctrl button:hover{background:var(--accent-2)}
  .ctrl .play{background:var(--accent);color:#15122e;border-color:var(--accent)}

  /* ====== Разделитель ====== */
  .divider{height:1px;margin:36px 0;background:linear-gradient(90deg,transparent,var(--accent-2),var(--moon),var(--blush),var(--accent),transparent)}

  /* ====== 3 окна в ряд ====== */
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;min-height:260px;box-shadow:0 0 24px rgba(159,220,255,.12)}
  .card h2{padding:16px 22px;font-size:1.15rem;text-align:center;border-bottom:1px solid var(--line)}
  .card p{padding:18px 22px;text-align:left;color:var(--muted)}

  /* ====== Переливающаяся обводка ====== */
  @property --angle{syntax:'<angle>';initial-value:0deg;inherits:false}
  @keyframes spin{to{--angle:360deg}}
  .card,.modal-box{position:relative}
  .card::before,.modal-box::before{
    content:"";position:absolute;inset:-1px;border-radius:inherit;padding:2px;pointer-events:none;
    background:conic-gradient(from var(--angle),var(--accent-2),var(--moon),var(--blush),var(--accent),var(--accent-2));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    animation:spin 6s linear infinite;
  }

  /* ====== Окно «О себе» ====== */
  .modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;
    background:rgba(10,9,24,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
  .modal.open{opacity:1;visibility:visible}
  .modal-box{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;
    box-shadow:0 0 40px rgba(159,220,255,.2);transform:translateY(24px) scale(.96);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  .modal.open .modal-box{transform:none}
  .modal-content{max-height:80vh;overflow:auto;border-radius:20px}
  .modal-content h2{padding:16px 56px 16px 22px;font-size:1.15rem;border-bottom:1px solid var(--line)}
  .modal-content p{padding:18px 22px 22px;color:var(--muted)}
  .modal-close{position:absolute;top:10px;right:12px;z-index:2;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);font-size:1.2rem;line-height:1;cursor:pointer;transition:background .2s}
  .modal-close:hover{background:var(--accent-2)}

  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media(max-width:860px){
    .cards{grid-template-columns:1fr}
  }
  @media(max-width:700px){
    .header{padding:24px;min-height:360px}
    .music{top:24px;right:24px;--mw:min(240px,calc(100vw - 80px))}
  }
  @media(prefers-reduced-motion:reduce){.reveal{transition:none;opacity:1;transform:none}.marq span.scroll{animation:none}.avatar-wrap,.card::before,.modal-box::before{animation:none}.modal,.modal-box{transition:none}body{animation:none}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="wrap">

  <!-- ===== ШАПКА ===== -->
  <header class="header reveal">
    <!-- ФОН ШАПКИ. Для видео замени <img> на:
         <video src="images/bg.mp4" autoplay muted loop playsinline></video> -->
    <div class="bg-media">
      <img src="images/bg1.jpg" alt="" onerror="this.remove()">
      <img src="images/bg2.jpg" alt="" onerror="this.remove()">
    </div>
    <div class="profile">
      <div class="avatar-wrap"><img class="avatar" src="images/avatar.jpg" alt="Аватарка"></div>
      <div class="nick">✧ 𝙬𝙞𝙨𝙩𝙚𝙧𝙞𝙖</div>
      <a class="about-box" href="https://github.com/avvizz?tab=repositories" target="_blank" rel="noopener">Created By avvizz</a>
    </div>

    <div class="music" id="music">
      <div class="marq" id="marq"><span id="marqText"></span></div>
      <button class="music-btn" id="musicBtn" aria-label="Открыть плеер">♫</button>
      <div class="music-body">
        <div class="track">
          <img class="cover" id="cover" alt="" src="">
          <div>
            <div class="t-title" id="title">Название</div>
            <div class="t-artist" id="artist">Исполнитель</div>
          </div>
        </div>
        <div class="bar" id="bar"><i id="fill"></i></div>
        <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
        <div class="ctrl">
          <button id="prev" aria-label="Назад">⏮</button>
          <button id="play" class="play" aria-label="Играть">▶</button>
          <button id="next" aria-label="Вперёд">⏭</button>
        </div>
      </div>
    </div>
  </header>

  <div class="divider reveal"></div>

  <!-- ===== ОСНОВНАЯ ЧАСТЬ ===== -->
  <main class="cards">
    <section class="card reveal">
      <h2>Название</h2>
      <p>Здесь будет твой текст. Он выровнен по левому краю.</p>
    </section>
    <section class="card reveal">
      <h2>Название</h2>
      <p>Текст второго окна.</p>
    </section>
  </main>
  <footer>Ну тут даже бог бессилен</footer>
</div>

<!-- ===== ОКНО «О СЕБЕ» ===== -->
<div class="modal" id="aboutModal" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
  <div class="modal-box">
    <button class="modal-close" id="aboutClose" type="button" aria-label="Закрыть">✕</button>
    <div class="modal-content">
      <h2 id="aboutTitle">О себе</h2>
      <p>Здесь будет текст о тебе. Замени его на свой.</p>
    </div>
  </div>
</div>

<audio id="audio" preload="auto"></audio>

<script>
  /* Плавное появление при прокрутке */
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting){ e.target.classList.add('show'); io.unobserve(e.target); }
  }), {threshold:.12});
  document.querySelectorAll('.reveal').forEach((el,i) => { el.style.transitionDelay = (i*0.12)+'s'; io.observe(el); });

  /* СПИСОК ТРЕКОВ — меняй под себя */
  const tracks = [
    {title:'Шаткая крыша', artist:'Mauko', src:'music/track1.mp3', cover:'images/cover1.jpg'},
    {title:'Тамагочи', artist:'zhanulka', src:'music/track2.mp3', cover:'images/cover2.jpg'},
    {title:'I Wanna Be Yours', artist:'Arctic Monkeys', src:'music/track3.mp3', cover:'images/cover3.jpg'},
	{title:'505', artist:'Arctic Monkeys', src:'music/track4.mp3', cover:'images/cover4.jpg'}
  ];

  const $ = id => document.getElementById(id);
  const audio = $('audio'), music = $('music');
  let i = 0

  const fmt = s => isFinite(s) ? Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0') : '0:00';

  function load(n){
    i = (n+tracks.length)%tracks.length;
    const t = tracks[i];
    audio.src = t.src;
    $('title').textContent = t.title;
    $('artist').textContent = t.artist;
    $('cover').src = t.cover;
    setMarq();
  }
  /* Название в плашке: если не влезает — прокручивается вместе с исполнителем */
  function setMarq(){
    const el = $('marqText'), box = $('marq'), t = tracks[i].title+' — '+tracks[i].artist;
    el.classList.remove('scroll');
    el.textContent = t;
    if (el.offsetWidth > box.clientWidth){
      const part = t+'      •      ';
      el.textContent = part+part;
      el.style.animationDuration = (t.length*0.3+5)+'s';
      el.classList.add('scroll');
    }
  }
  addEventListener('resize', setMarq);
  addEventListener('load', setMarq);
  function play(){ return audio.play().then(()=>{$('play').textContent='❚❚'}).catch(()=>{$('play').textContent='▶'}); }
  function toggle(){ audio.paused ? play() : (audio.pause(), $('play').textContent='▶'); }

  music.onclick = () => music.classList.add('open');            // клик по плашке — раскрыть
  $('musicBtn').onclick = e => { e.stopPropagation(); music.classList.toggle('open'); };  // значок — раскрыть/свернуть
  $('play').onclick = toggle;
  $('next').onclick = () => { load(i+1); play(); };
  $('prev').onclick = () => { load(i-1); play(); };
  audio.onended = () => { load(i+1); play(); };
  audio.ontimeupdate = () => {
    $('fill').style.width = (audio.currentTime/audio.duration*100||0)+'%';
    $('cur').textContent = fmt(audio.currentTime);
  };
  audio.onloadedmetadata = () => $('dur').textContent = fmt(audio.duration);
  $('bar').onclick = e => {
    const r = $('bar').getBoundingClientRect();
    audio.currentTime = (e.clientX-r.left)/r.width*audio.duration;
  };
  $('cover').onerror = e => e.target.removeAttribute('src');

  load(i);
  /* Автозапуск: если браузер блокирует звук, музыка начнётся при первом клике по странице */
  play();
  addEventListener('pointerdown', () => { if (audio.paused && audio.currentTime === 0) play(); }, {once:true});
  /* Окно «О себе»: открыть кнопкой, закрыть крестиком, клавишей Esc или кликом по фону */
  const about = $('aboutModal'), aboutBtn = $('aboutBtn');
  function openAbout(){ about.classList.add('open'); document.body.style.overflow='hidden'; $('aboutClose').focus(); }
  function closeAbout(){ about.classList.remove('open'); document.body.style.overflow=''; aboutBtn.focus(); }
  if (aboutBtn) aboutBtn.onclick = openAbout;
  $('aboutClose').onclick = closeAbout;
  about.onclick = e => { if (e.target === about) closeAbout(); };
  addEventListener('keydown', e => { if (e.key === 'Escape' && about.classList.contains('open')) closeAbout(); });
  /* Мерцающие полумесяцы, медленно дрейфующие по экрану */
  (function(){
    const cv = $('sky'), ctx = cv.getContext('2d');
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let W, H, dpr, moons = [];

    /* заготовка полумесяца с мягким свечением */
    function sprite(color, glow){
      const S = 96, c = document.createElement('canvas'); c.width = c.height = S;
      const x = c.getContext('2d'), m = document.createElement('canvas'); m.width = m.height = S;
      const y = m.getContext('2d');
      y.fillStyle = color; y.beginPath(); y.arc(48,48,26,0,Math.PI*2); y.fill();
      y.globalCompositeOperation = 'destination-out';
      y.beginPath(); y.arc(60,42,22,0,Math.PI*2); y.fill();
      x.shadowColor = glow; x.shadowBlur = 14; x.drawImage(m,0,0);
      return c;
    }
    const sprites = [sprite('#e6e9f7','rgba(230,233,247,.9)'), sprite('#bfe6ff','rgba(143,208,255,.9)')];

    function resize(){
      dpr = Math.min(devicePixelRatio||1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W*dpr; cv.height = H*dpr;
      ctx.setTransform(dpr,0,0,dpr,0,0);
      const n = Math.max(18, Math.min(55, Math.round(W*H/38000)));
      while (moons.length < n) moons.push(spawn());
      moons.length = n;
    }
    function spawn(){
      const r = Math.random();
      return {
        x: Math.random()*W, y: Math.random()*H,
        size: 8 + Math.random()*18,
        vx: (Math.random()-.5)*.25, vy: -.05 - Math.random()*.18,
        rot: Math.random()*Math.PI*2, vr: (Math.random()-.5)*.003,
        ph: Math.random()*Math.PI*2, sp: .5 + Math.random()*1.2,
        img: sprites[r < .6 ? 0 : 1], max: .35 + Math.random()*.5
      };
    }
    function draw(t){
      ctx.clearRect(0,0,W,H);
      for (const m of moons){
        if (!still){
          m.x += m.vx; m.y += m.vy; m.rot += m.vr;
          const pad = m.size;
          if (m.x < -pad) m.x = W+pad; else if (m.x > W+pad) m.x = -pad;
          if (m.y < -pad) m.y = H+pad; else if (m.y > H+pad) m.y = -pad;
        }
        const tw = still ? .7 : .5 + .5*Math.sin(t*.001*m.sp + m.ph);
        ctx.globalAlpha = .12 + m.max*tw;
        ctx.save();
        ctx.translate(m.x, m.y); ctx.rotate(m.rot);
        ctx.drawImage(m.img, -m.size, -m.size, m.size*2, m.size*2);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
      if (!still) requestAnimationFrame(draw);
    }
    addEventListener('resize', () => { resize(); if (still) draw(0); });
    resize(); draw(0);
  })();
</script>
</body>
</html>
